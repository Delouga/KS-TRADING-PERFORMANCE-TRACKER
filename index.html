<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forex Pro Trader Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header id="topbar">
    <div class="brand">Forex Pro Trader Tracker</div>
    <div class="yearnav">
      <span class="lbl">Année</span>
      <button id="y-prev" class="btn sm" title="Année précédente">&#8249;</button>
      <select id="y-select" title="Choisir une année"></select>
      <button id="y-next" class="btn sm" title="Année suivante">&#8250;</button>
    </div>
    <button id="y-new" class="btn">+ Nouvelle année</button>
    <button id="y-del" class="btn ghost">Supprimer cette année</button>
  </header>
  <main id="view"></main>
  <nav id="tabs"></nav>
  <div id="modal" hidden></div>
  <script src="calc.js"></script>
  <script src="charts.js"></script>
  <script src="app.js"></script>
</body>
</html>
