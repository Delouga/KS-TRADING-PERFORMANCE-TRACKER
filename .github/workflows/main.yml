const { app, BrowserWindow, ipcMain, dialog, Menu } = require('electron');
const path = require('path');
const fs = require('fs');

const dataFile = () => path.join(app.getPath('userData'), 'donnees.json');
let win = null;

function createWindow() {
  win = new BrowserWindow({
    width: 1500,
    height: 900,
    minWidth: 900,
    minHeight: 600,
    backgroundColor: '#3f3f3f',
    title: 'Forex Pro Trader Tracker',
    icon: path.join(__dirname, 'build', 'icon.png'),

    webPreferences: {
      preload: path.join(__dirname, 'preload.js'),
      contextIsolation: true,
      nodeIntegration: false,
      sandbox: false
    }
  });

  win.maximize();

  // Diagnostic du chargement de l'application
  win.webContents.on('did-fail-load', (_event, errorCode, errorDescription, validatedURL) => {
    console.error('ERREUR DE CHARGEMENT ELECTRON');
    console.error('Code:', errorCode);
    console.error('Description:', errorDescription);
    console.error('URL:', validatedURL);

    dialog.showErrorBox(
      'Erreur de chargement',
      `Impossible de charger l'application.\n\nCode : ${errorCode}\nDescription : ${errorDescription}\n\nURL : ${validatedURL}`
    );
  });

  // Capture les erreurs JavaScript de l'interface
  win.webContents.on('console-message', (_event, level, message, line, sourceId) => {
    console.log(
      `[Renderer] niveau=${level} | ${message} | ligne=${line} | source=${sourceId}`
    );
  });

  // Détecte un problème du processus renderer
  win.webContents.on('render-process-gone', (_event, details) => {
    console.error('PROCESSUS RENDERER ARRÊTÉ :', details);

    dialog.showErrorBox(
      'Erreur de l’application',
      `Le moteur de l'interface s'est arrêté.\n\nRaison : ${details.reason}\nCode : ${details.exitCode}`
    );
  });

  // Charge explicitement la page de l'application
  const indexPath = path.join(__dirname, 'src', 'index.html');

  console.log('Chargement de :', indexPath);
  console.log('Fichier index.html existe :', fs.existsSync(indexPath));

  win.loadFile(indexPath);

  buildMenu();

  win.webContents.on('dom-ready', () => {
    console.log('DOM READY : index.html chargé');
  });
}

function buildMenu() {
  const template = [
    {
      label: 'Fichier',
      submenu: [
        {
          label: 'Exporter une sauvegarde…',
          accelerator: 'CmdOrCtrl+E',
          click: exportData
        },
        {
          label: 'Importer une sauvegarde…',
          accelerator: 'CmdOrCtrl+I',
          click: importData
        },
        { type: 'separator' },
        { role: 'quit', label: 'Quitter' }
      ]
    },
    {
      label: 'Affichage',
      submenu: [
        { role: 'zoomIn', label: 'Zoom avant' },
        { role: 'zoomOut', label: 'Zoom arrière' },
        { role: 'resetZoom', label: 'Zoom normal' },
        { type: 'separator' },
        { role: 'togglefullscreen', label: 'Plein écran' }
      ]
    }
  ];

  Menu.setApplicationMenu(Menu.buildFromTemplate(template));
}

async function exportData() {
  if (!win) return;

  const { canceled, filePath } = await dialog.showSaveDialog(win, {
    title: 'Exporter une sauvegarde',
    defaultPath: 'sauvegarde-track-record.json',
    filters: [{ name: 'Sauvegarde JSON', extensions: ['json'] }]
  });

  if (canceled || !filePath) return;

  try {
    const content = fs.existsSync(dataFile())
      ? fs.readFileSync(dataFile(), 'utf8')
      : '{}';

    fs.writeFileSync(filePath, content, 'utf8');
  } catch (e) {
    dialog.showErrorBox(
      'Export impossible',
      String(e.message || e)
    );
  }
}

async function importData() {
  if (!win) return;

  const { canceled, filePaths } = await dialog.showOpenDialog(win, {
    title: 'Importer une sauvegarde',
    properties: ['openFile'],
    filters: [{ name: 'Sauvegarde JSON', extensions: ['json'] }]
  });

  if (canceled || !filePaths.length) return;

  try {
    const parsed = JSON.parse(
      fs.readFileSync(filePaths[0], 'utf8')
    );

    win.webContents.send('data:imported', parsed);
  } catch (e) {
    dialog.showErrorBox(
      'Import impossible',
      'Ce fichier n\'est pas une sauvegarde valide.'
    );
  }
}

ipcMain.handle('data:load', () => {
  try {
    if (fs.existsSync(dataFile())) {
      return JSON.parse(
        fs.readFileSync(dataFile(), 'utf8')
      );
    }
  } catch (e) {
    console.error('Erreur lecture données :', e);
  }

  return null;
});

ipcMain.handle('data:save', (_evt, data) => {
  try {
    const tmp = dataFile() + '.tmp';

    fs.mkdirSync(
      path.dirname(dataFile()),
      { recursive: true }
    );

    fs.writeFileSync(
      tmp,
      JSON.stringify(data),
      'utf8'
    );

    fs.renameSync(tmp, dataFile());

    return true;
  } catch (e) {
    console.error('Erreur sauvegarde :', e);
    return false;
  }
});

const gotLock = app.requestSingleInstanceLock();

if (!gotLock) {
  app.quit();
} else {
  app.on('second-instance', () => {
    if (win) {
      if (win.isMinimized()) win.restore();
      win.focus();
    }
  });

  app.whenReady().then(createWindow);

  app.on('window-all-closed', () => {
    app.quit();
  });
}
